<main class="todo-app">
  <section class="todo-card">
    <header class="todo-header">
      <div>
        <p class="eyebrow">Task manager</p>
        <h1>Todo List</h1>
      </div>
    </header>

    <form class="todo-form" (ngSubmit)="addTodo()">
      <input
        type="text"
        [(ngModel)]="newTodoTitle"
        name="newTodoTitle"
        placeholder="Add a new todo" 
        aria-label="Add a new todo"
      />
      <button type="submit" [disabled]="!newTodoTitle.trim()">Add</button>
    </form>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div *ngIf="isLoading" class="loading">Loading tasks...</div>

    <ul class="todo-list" *ngIf="!isLoading">
      <li *ngFor="let todo of todos" class="todo-item">
        <label class="todo-check">
          <input type="checkbox" [checked]="todo.isCompleted" (change)="toggleTodo(todo)" />
        </label>

        <div class="todo-content" [class.completed]="todo.isCompleted">
          <ng-container *ngIf="editingId !== todo.id; else editTemplate">
            <span>{{ todo.title }}</span>
          </ng-container>

          <ng-template #editTemplate>
            <input
              type="text"
              [(ngModel)]="editTitle"
              name="editTitle"
              aria-label="Edit todo title"
            />
          </ng-template>
        </div>

        <div class="todo-actions">
          <ng-container *ngIf="editingId === todo.id; else normalActions">
            <button type="button" class="save-button" (click)="saveEdit(todo)">Save</button>
            <button type="button" class="ghost-button" (click)="cancelEdit()">Cancel</button>
          </ng-container>

          <ng-template #normalActions>
            <button type="button" class="ghost-button" (click)="startEditing(todo)">Edit</button>
            <button type="button" class="delete-button" (click)="deleteTodo(todo.id)">Delete</button>
          </ng-template>
        </div>
      </li>

      <li *ngIf="!todos.length" class="empty-state">
        No tasks yet. Add one above to get started.
      </li>
    </ul>
  </section>
</main>

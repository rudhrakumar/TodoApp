<main class="todo-app">
  <section class="todo-card">
    <header class="todo-header">
      <div>
        <h1>Todo List</h1>
      </div>
    </header>

    <div class="todo-form">
      <input
        type="text"
        [(ngModel)]="newTodoTitle"
        name="newTodoTitle"
        placeholder="Add a new todo"
        aria-label="Add a new todo"
        [disabled]="isSaving"
      />
      <button type="button" (click)="addTodo()" [disabled]="!newTodoTitle.trim() || isSaving">
        {{ isSaving ? 'Saving...' : 'Add' }}
      </button>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div *ngIf="isLoading" class="loading">Loading tasks...</div>

    <ul class="todo-list" *ngIf="!isLoading">
      <li *ngFor="let todo of todos" class="todo-item">
        <label class="todo-check">
          <input
            type="checkbox"
            [checked]="todo.isCompleted"
            [disabled]="todo.id === undefined || togglingIds.has(todo.id)"
            (change)="toggleTodo(todo)"
          />
        </label>

        <div class="todo-content" [class.completed]="todo.isCompleted">
          <span>{{ todo.title }}</span>
        </div>

        <div class="todo-actions">
          <button
            type="button"
            class="delete-button"
            [disabled]="todo.id === undefined || deletingIds.has(todo.id)"
            (click)="deleteTodo(todo.id)"
          >
            {{ deletingIds.has(todo.id ?? -1) ? 'Deleting...' : 'Delete' }}
          </button>
        </div>
      </li>

      <li *ngIf="!todos.length" class="empty-state">
        No tasks yet. Add one above to get started.
      </li>
    </ul>
  </section>
</main>
